set gfxpayload=text
set timeout=2
set default=0
set menu_color_normal=white/black
set menu_color_highlight=black/white
menuentry "Boot BurnOS (Standard)" {
	multiboot /boot/kernelstd.bin
	boot
}
menuentry "Boot BurnOS (Debug)" {
	multiboot /boot/kerneldbg.bin
	boot
}
menuentry "Reboot" {
	reboot
}
menuentry "Poweroff" {
	halt
}
